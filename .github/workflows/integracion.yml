name: Angular, Spring Boot y SQL Server
on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  integracion:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      DEMO_ADMIN_PASSWORD: PandaCiAdmin_91
      DEMO_USER_PASSWORD: PandaCiUser_91
      MSSQL_SA_PASSWORD: PandaCiSql_91
      E2E_SQL_CONTAINER: panda-sql
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Iniciar SQL Server
        run: |
          docker network create panda-ci
          docker run -d --name panda-sql --network panda-ci -e ACCEPT_EULA=Y -e MSSQL_PID=Developer -e MSSQL_SA_PASSWORD mcr.microsoft.com/mssql/server:2022-latest
      - name: Construir la imagen y ejecutar pruebas Spring
        run: docker build --tag panda:ci .
      - name: Crear la base y arrancar la aplicación
        run: |
          sqlcmd() {
            docker exec panda-sql sh -c 'SQLCMDPASSWORD="$MSSQL_SA_PASSWORD" /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -C -b -Q "$1"' sqlcmd "$1"
          }
          for attempt in {1..40}; do
            if sqlcmd 'SELECT 1'; then break; fi
            if [ "$attempt" -eq 40 ]; then exit 1; fi
            sleep 3
          done
          sqlcmd 'CREATE DATABASE PandaBobbaBD'
          docker run -d --name panda-app --network panda-ci -p 8080:8080 \
            -e 'SPRING_DATASOURCE_URL=jdbc:sqlserver://panda-sql:1433;databaseName=PandaBobbaBD;encrypt=true;trustServerCertificate=true' \
            -e SPRING_DATASOURCE_USERNAME=sa -e SPRING_DATASOURCE_PASSWORD="$MSSQL_SA_PASSWORD" \
            -e DEMO_ADMIN_PASSWORD -e DEMO_USER_PASSWORD panda:ci
          timeout 120 bash -c 'until curl -fsS http://localhost:8080/app/index.html > /dev/null; do sleep 3; done'
      - name: Instalar Chromium y probar desde el navegador
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npm run test:e2e
      - name: Mostrar diagnósticos
        if: failure()
        run: |
          docker logs panda-sql || true
          docker logs panda-app || true
