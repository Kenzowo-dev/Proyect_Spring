<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Iniciar Sesión - Panda Bobba</title>

    <link rel="stylesheet" th:href="@{/css/bootstrap.min.css}">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            font-family: Arial, Helvetica, sans-serif;
            background-color: #eaf4ec;
        }

        .login-container {
            min-height: 100vh;
            display: flex;
        }

        /* =========================
           LADO IZQUIERDO - IMAGEN
        ========================== */

        .login-image {
            width: 55%;
            min-height: 100vh;

            background-image:
                linear-gradient(
                    rgba(20, 80, 45, 0.15),
                    rgba(20, 80, 45, 0.15)
                ),
                url('/images/login-side.jpg');

            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;

            position: relative;
        }

        .image-overlay {
            position: absolute;
            bottom: 50px;
            left: 50px;

            color: white;

            text-shadow:
                0 2px 8px rgba(0, 0, 0, 0.4);
        }

        .image-overlay h1 {
            font-size: 42px;
            font-weight: 700;
            margin-bottom: 5px;
        }

        .image-overlay p {
            font-size: 18px;
        }


        /* =========================
           LADO DERECHO - LOGIN
        ========================== */

        .login-section {
            width: 45%;
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 40px;

            background-color: #eaf4ec;
        }

        .login-box {
            width: 100%;
            max-width: 420px;

            background: white;

            padding: 45px 40px;

            border-radius: 20px;

            box-shadow:
                0 15px 40px rgba(38, 91, 57, 0.12);
        }

        .logo {
            width: 85px;
            height: 85px;

            object-fit: cover;

            border-radius: 50%;

            margin-bottom: 15px;

            border: 4px solid #e0f0e4;
        }

        .login-header {
            text-align: center;
            margin-bottom: 32px;
        }

        .login-header h2 {
            font-size: 28px;
            font-weight: 700;

            color: #245c39;

            margin-bottom: 5px;
        }

        .login-header p {
            color: #789184;
            font-size: 15px;
        }


        /* =========================
           CAMPOS
        ========================== */

        .form-label {
            font-weight: 600;
            color: #3d5546;
            margin-bottom: 8px;
        }

        .input-group {
            margin-bottom: 20px;
        }

        .input-group-text {
            background-color: #f3f8f4;

            border: 1px solid #d7e6da;
            border-right: none;

            color: #49855e;

            padding-left: 16px;
            padding-right: 16px;
        }

        .form-control {
            height: 52px;

            border: 1px solid #d7e6da;
            border-left: none;

            background-color: #f3f8f4;

            padding-left: 5px;
        }

        .form-control:focus {
            background-color: white;

            border-color: #72ad84;

            box-shadow:
                0 0 0 0.2rem rgba(81, 145, 99, 0.15);
        }

        .input-group:focus-within .input-group-text {
            border-color: #72ad84;
            background-color: white;
        }


        /* =========================
           BOTÓN
        ========================== */

        .btn-login {
            width: 100%;

            height: 52px;

            border: none;

            border-radius: 10px;

            background-color: #3b7d50;

            color: white;

            font-size: 16px;
            font-weight: 600;

            transition: all 0.25s ease;
        }

        .btn-login:hover {
            background-color: #2f6841;

            transform: translateY(-1px);

            box-shadow:
                0 8px 18px rgba(48, 106, 67, 0.2);
        }


        /* =========================
           VOLVER
        ========================== */

        .back-link {
            text-align: center;
            margin-top: 25px;
        }

        .back-link a {
            color: #4d755b;

            text-decoration: none;

            font-size: 14px;
            font-weight: 500;
        }

        .back-link a:hover {
            color: #2f6841;
        }



        .alert {
            border-radius: 10px;
            font-size: 14px;
        }


        @media (max-width: 900px) {

            .login-image {
                width: 45%;
            }

            .login-section {
                width: 55%;
                padding: 25px;
            }

        }

        @media (max-width: 768px) {

            .login-container {
                display: block;
            }

            .login-image {
                display: none;
            }

            .login-section {
                width: 100%;
                min-height: 100vh;

                padding: 25px;

                background-color: #eaf4ec;
            }

            .login-box {
                max-width: 430px;
            }

        }

    </style>

</head>

<body>

<div class="login-container">


    <!-- =====================================
         LADO IZQUIERDO
    ====================================== -->

    <section class="login-image">

        <div class="image-overlay">

            <h1>Panda Bobba</h1>

            <p>Administración y gestión de tu negocio</p>

        </div>

    </section>


    <!-- =====================================
         LADO DERECHO
    ====================================== -->

    <section class="login-section">

        <div class="login-box">


            <!-- ENCABEZADO -->

            <div class="login-header">

                <img
                    th:src="@{/images/icono.jpg}"
                    alt="Panda Bobba"
                    class="logo"
                >

                <h2>Bienvenido</h2>

                <p>Ingresa tus credenciales para continuar</p>

            </div>


            <!-- ERROR -->

            <div
                th:if="${error}"
                class="alert alert-danger alert-dismissible fade show"
                role="alert"
            >

                <i class="bi bi-exclamation-triangle-fill me-2"></i>

                <span th:text="${error}"></span>

                <button
                    type="button"
                    class="btn-close"
                    data-bs-dismiss="alert"
                ></button>

            </div>


            <!-- LOGOUT / MENSAJE -->

            <div
                th:if="${message}"
                class="alert alert-success alert-dismissible fade show"
                role="alert"
            >

                <i class="bi bi-check-circle-fill me-2"></i>

                <span th:text="${message}"></span>

                <button
                    type="button"
                    class="btn-close"
                    data-bs-dismiss="alert"
                ></button>

            </div>


            <!-- FORMULARIO -->

            <form th:action="@{/login}" method="post">


                <!-- USUARIO -->

                <label for="username" class="form-label">
                    Usuario
                </label>

                <div class="input-group">

                    <span class="input-group-text">

                        <i class="bi bi-person"></i>

                    </span>

                    <input
                        type="text"
                        class="form-control"
                        id="username"
                        name="username"
                        placeholder="Ingrese su usuario"
                        required
                        autofocus
                    >

                </div>


                <!-- CONTRASEÑA -->

                <label for="password" class="form-label">
                    Contraseña
                </label>

                <div class="input-group">

                    <span class="input-group-text">

                        <i class="bi bi-lock"></i>

                    </span>

                    <input
                        type="password"
                        class="form-control"
                        id="password"
                        name="password"
                        placeholder="Ingrese su contraseña"
                        required
                    >

                </div>


                <!-- BOTÓN -->

                <button
                    type="submit"
                    class="btn-login mt-2"
                >

                    <i class="bi bi-box-arrow-in-right me-2"></i>

                    Iniciar sesión

                </button>

            </form>


            <!-- VOLVER -->

            <div class="back-link">

                <a th:href="@{/}">

                    <i class="bi bi-arrow-left me-1"></i>

                    Volver al sitio web

                </a>

            </div>


        </div>

    </section>

</div>


<script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
</script>

</body>
</html>
