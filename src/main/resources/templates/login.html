<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Iniciar sesión | Panda Bobba</title><meta name="robots" content="noindex">
    <link rel="icon" href="/images/icono.jpg"><link rel="stylesheet" href="/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet"><link rel="stylesheet" href="/css/login-panel.css">
</head>
<body>
    <a class="skip-link" href="#contenido">Ir al contenido</a>
    <main class="login-container">
        <div class="login-image" role="img" aria-label="Bebidas de bubble tea Panda Bobba">
            <div class="image-overlay"><h2>Panda Bobba</h2><p>Un sorbo de felicidad.</p></div>
        </div>
        <section id="contenido" class="login-section" aria-labelledby="tituloSesion">
            <div class="login-box">
                <div class="login-header"><img src="/images/icono.jpg" alt="Panda Bobba" class="logo"><h1 id="tituloSesion">Bienvenido.</h1><p>Tu catálogo empieza aquí. Ingresa a tu cuenta.</p></div>
                <div id="loginEstado" class="alert alert-secondary" role="status" aria-live="polite" hidden></div>
                <form id="login">
                    <label for="usuario" class="form-label">Usuario</label>
                    <div class="input-group"><span class="input-group-text" aria-hidden="true"><i class="bi bi-person"></i></span><input id="usuario" name="username" type="text" class="form-control" placeholder="Ingrese su usuario" required maxlength="50" autocomplete="username" autofocus></div>
                    <label for="clave" class="form-label">Contraseña</label>
                    <div class="input-group"><span class="input-group-text" aria-hidden="true"><i class="bi bi-lock"></i></span><input id="clave" name="password" type="password" class="form-control" placeholder="Ingrese su contraseña" required autocomplete="current-password"></div>
                    <button id="entrar" type="submit" class="btn-login mt-2"><i class="bi bi-box-arrow-in-right me-2" aria-hidden="true"></i><span>Iniciar sesión</span></button>
                </form>
                <div class="back-link"><a href="/"><i class="bi bi-arrow-left me-1" aria-hidden="true"></i>Volver al sitio web</a></div>
            </div>
        </section>
    </main>
    <script src="/js/login-panel.js" defer></script>
</body>
</html>
