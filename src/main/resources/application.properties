spring.application.name=spring_bobba

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:sqlserver://localhost:1433;databaseName=PandaBobbaBD;encrypt=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:spring_user}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

panda.bootstrap.admin-password=${PANDA_BOOTSTRAP_ADMIN_PASSWORD:}
panda.bootstrap.user-password=${PANDA_BOOTSTRAP_USER_PASSWORD:}
