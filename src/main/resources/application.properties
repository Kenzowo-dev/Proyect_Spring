spring.application.name=spring_bobba
server.port=${PORT:8080}

# Dokploy must provide these values as environment variables/secrets.
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jackson.deserialization.accept-float-as-int=false

panda.bootstrap.admin-password=${PANDA_BOOTSTRAP_ADMIN_PASSWORD:}
panda.bootstrap.user-password=${PANDA_BOOTSTRAP_USER_PASSWORD:}
